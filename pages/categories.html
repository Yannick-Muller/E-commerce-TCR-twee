<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop | Webshop</title>

    <!-- Bestaande vormgeving van de shoppagina. -->
    <link rel="stylesheet" href="../assets/css/style.css" />

    <!-- Header (navigatie + zoekbalk), op alle pagina's hetzelfde. -->
    <link rel="stylesheet" href="../assets/css/header.css" />

    <!-- Nieuwe vormgeving voor favorieten. -->
    <link rel="stylesheet" href="../assets/css/favorites.css" />

    <!-- Flash sale: countdown en kortingsprijzen. -->
    <link rel="stylesheet" href="../assets/css/sale.css" />

    <!-- Loading state en foutmelding bij het ophalen van producten. -->
    <link rel="stylesheet" href="../assets/css/loading.css" />

    <!-- Verwijdert producten die langer dan 3 dagen in de winkelwagen staan. -->
    <script src="../assets/js/core/cart-expiry.js"></script>

    <!-- Haalt products.json op met fetch() en laadt daarna de scripts
         hieronder in deze volgorde: flash sale, productkaarten,
         zoekfunctie en favorieten. -->
    <script
      src="../assets/js/core/products-loader.js"
      data-then="../assets/js/core/sale.js,../assets/js/shop/shop-products.js,../assets/js/shop/searchbar.js,../assets/js/shop/category-filter.js,../assets/js/core/favorites.js"
    ></script>
  </head>

  <body>
    <!-- =====================================================
         HEADER (op alle pagina's hetzelfde, zie assets/css/header.css)
         ===================================================== -->

<header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link" aria-current="page">Shop</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="../pages/help.html" class="nav-link">Help</a>
        <a href="../cart.html" class="nav-link nav-cart">Cart (<span id="cart-count">0</span>)</a>
      </nav>

      <!-- Countdown van de flash sale (wordt gevuld door sale.js). -->
      <div id="flash-sale"></div>
    </header>

    <main class="categories">
      <!-- Zoekbalk (zonder icoon) -->
      <section class="search-section categories__search">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Zoek producten..."
            aria-label="Zoek producten"
          />
        </div>
      </section>

      <!-- =================================================
           ZIJBALK
           ================================================= -->

      <aside class="categories__sidebar">

        <h2>New Ins</h2>

        <ul class="categories__list">
          <h3>Feature</h3>
          <p>New Arrivals</p>
          <li class="feature-flash"><a href="">Sneakers</a></li>
          <li class="feature-flash"><a href="">T-shirt</a></li>
          <li class="feature-flash"><a href="">Koptelefoon</a></li>
        </ul>

        <!-- Categoriefilter: de knoppen worden door category-filter.js
             gemaakt op basis van products.json. -->
        <ul class="categories__list" id="category-filter">
          <h3>Shop category</h3>
        </ul>
      </aside>

      <!-- =================================================
           PRODUCTEN
           ================================================= -->

      <section class="categories__products" id="products">
        <!-- De productkaarten worden ingeladen door shop-products.js -->
      </section>
    </main>
  </body>
</html>
