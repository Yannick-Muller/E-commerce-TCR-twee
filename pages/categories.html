<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop | Webshop</title>

    <!-- Bestaande vormgeving van de shoppagina. -->
    <link rel="stylesheet" href="../assets/css/style.css" />

    <!-- Nieuwe vormgeving voor favorieten. -->
    <link rel="stylesheet" href="../favorites.css" />

    <!-- Flash sale: countdown en kortingsprijzen. -->
    <link rel="stylesheet" href="../sale.css" />

    <!-- Haalt products.json op met fetch() en laadt daarna de scripts
         hieronder in deze volgorde: flash sale, productkaarten,
         zoekfunctie en favorieten. -->
    <script
      src="../products-loader.js"
      data-then="../sale.js,../shop-products.js,../assets/js/searchbar.js,../favorites.js"
    ></script>
  </head>

  <body>
    <!-- =====================================================
         NAVIGATIE
         ===================================================== -->

    <nav class="nav">
      <div class="nav__input">
        <input type="search" placeholder="search..." />

        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>

          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>

          <g id="SVGRepo_iconCarrier">
            <path
              d="M14.9536 14.9458L21 21M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"

              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </g>
        </svg>
      </div>

      <ul class="nav__content">
        <li class="nav__content--item">
          <a href="../index.html">Home</a>
        </li>

        <li class="nav__content--item">
          <a href="./categories.html">Shop</a>
        </li>

        <li class="nav__content--item">
          <a href="">About</a>
        </li>

        <li class="nav__content--item">
          <a href="">Help</a>
        </li>

        <li class="nav__content--item">
          <a href="../cart.html">Cart (<span id="cart-count">0</span>)</a>
        </li>
      </ul>
    </nav>

    <!-- Countdown van de flash sale (wordt gevuld door sale.js). -->
    <div id="flash-sale"></div>

    <main class="categories">
      <!-- =================================================
           ZIJBALK
           ================================================= -->

      <aside class="categories__sidebar">
        <p>New Arrivals</p>

        <h2>New Ins</h2>

        <ul class="categories__list">
          <h3>Feature</h3>

          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
        </ul>

        <ul class="categories__list">
          <h3>Shop category</h3>

          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
          <li><a href="">Text</a></li>
        </ul>

        <div class="categories__filter">
          <p>Filter (0)</p>

          <p>size</p>

          <div class="categories__sizes">
            <p>1</p>
            <p>2</p>
            <p>3</p>
            <p>4</p>
            <p>5</p>
            <p>6</p>
            <p>7</p>
            <p>8</p>
            <p>9</p>
            <p>10</p>
          </div>
        </div>
      </aside>

      <!-- =================================================
           PRODUCTEN
           ================================================= -->

      <section class="categories__products" id="products">
        <!-- De productkaarten worden ingeladen door shop-products.js -->
      </section>
