<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Webshop</title>

    <!-- Bestaande vormgeving behouden. -->
    <link rel="stylesheet" href="assets/css/style-nikan.css" />

    <!-- Nieuwe vormgeving voor favorieten. -->
    <link rel="stylesheet" href="assets/css/favorites.css" />

    <!-- Flash sale: countdown en kortingsprijzen. -->
    <link rel="stylesheet" href="assets/css/sale.css" />

    <!-- Verwijdert producten die langer dan 3 dagen in de winkelwagen staan.
         Moet vóór de andere scripts geladen worden. -->
    <script src="assets/js/core/cart-expiry.js"></script>
  </head>

  <body>
    <div class="app">
      <!-- =====================================================
           NAVIGATIE
           ===================================================== -->

      <nav class="navbar">
        <a href="index.html" class="nav-link active"> Home </a>

        <a href="pages/categories.html" class="nav-link"> Shop </a>

        <a href="#about" class="nav-link"> About </a>

        <a href="#help" class="nav-link"> Help </a>
      </nav>

      <!-- Countdown van de flash sale (wordt gevuld door sale.js). -->
      <div id="flash-sale"></div>

      <!-- =====================================================
           LOGO
           ===================================================== -->

      <header class="header" id="home">
        <div class="logo">
          <img src="images/logo.png" alt="Logo van de webshop" />
        </div>
      </header>

      <main>
        <!-- =================================================
             ZOEKBALK
             ================================================= -->

        <section class="search-section">
          <div class="search-box">
            <span class="search-icon">🔍</span>

            <input
              type="text"
              id="search-input"
              placeholder="Zoek producten..."
            />
          </div>
        </section>

        <!-- =================================================
             CATEGORIEËN
             ================================================= -->

        <section class="section" id="shop">
          <div class="section-header">
            <h2>Categorieën</h2>

            <!-- Reset het categoriefilter en de zoekbalk. -->
            <button type="button" class="view-all" id="show-all-categories">
              Toon alles
            </button>
          </div>

          <div class="categories">
            <!-- Schoenen -->
            <button class="category-card" data-category="schoenen">
              <div class="category-image">
                <img src="images/category-shoes.png" alt="Schoenen" />
              </div>

              <span>Schoenen</span>
            </button>

            <!-- Kleding -->
            <button class="category-card" data-category="kleding">
              <div class="category-image">
                <img src="images/category-clothing.png" alt="Kleding" />
              </div>

              <span>Kleding</span>
            </button>

            <!-- Accessoires -->
            <button class="category-card" data-category="accessoires">
              <div class="category-image">
                <img src="images/category-accessories.png" alt="Accessoires" />
              </div>

              <span>Accessoires</span>
            </button>

            <!-- Elektronica -->
            <button class="category-card" data-category="elektronica">
              <div class="category-image">
                <img src="images/category-electronics.png" alt="Elektronica" />
              </div>

              <span>Elektronica</span>
            </button>
          </div>
        </section>

        <!-- =================================================
             PRODUCTEN
             ================================================= -->

        <section class="section">
          <div class="section-header">
            <h2>Populaire producten</h2>
          </div>

          <div class="products" id="products">
            <!-- De kaarten worden ingeladen door home-products.js -->
          </div>

          <!-- Wordt zichtbaar als zoeken niets oplevert. -->
          <p id="no-results" class="no-results hidden">
            Geen producten gevonden.
          </p>
        </section>

        <!-- =================================================
             NIEUWE COLLECTIE
             ================================================= -->

        <section class="collection-banner">
          <div class="collection-text">
            <h2>Nieuwe collectie</h2>

            <p>Bekijk onze nieuwste items</p>

            <button class="shop-button" id="shop-now-button">Shop nu</button>
          </div>

          <div class="collection-image">
            <img src="images/new-collection.jpg" alt="Nieuwe collectie" />
          </div>
        </section>
      </main>
    </div>

    <!-- Haalt products.json op met fetch() en laadt daarna de scripts
         hieronder in deze volgorde: flash sale, productkaarten,
         zoeken/filteren/winkelwagen en favorieten. -->
    <script
      src="assets/js/core/products-loader.js"
      data-then="assets/js/core/sale.js,assets/js/home/home-products.js,assets/js/home/script.js,assets/js/core/favorites.js"
    ></script>
  </body>
</html>
